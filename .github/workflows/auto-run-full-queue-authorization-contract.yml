name: Auto-Run Full Queue authorization contract

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-run-full-queue-auth-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run Queue authorization tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.auto_run_full_queue.test_batch_authorization

      - name: Validate A3 authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          required = [
              Path('docs/AUTO_RUN_FULL_QUEUE_AUTHORIZATION_V1.md'),
              Path('policy/auto-run-full-queue-authorization-v1.json'),
              Path('policy/schemas/auto-run-full-queue-authorization-v1.schema.json'),
              Path('scripts/validate_auto_run_full_queue_authorization.py'),
              Path('tests/auto_run_full_queue/test_batch_authorization.py'),
          ]
          for path in required:
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'missing A3 contract file: {path}')

          policy = json.loads(Path('policy/auto-run-full-queue-authorization-v1.json').read_text())
          if policy.get('status') != 'A3_SHARED_BATCH_AUTHORIZATION_CONTRACT_NOT_ACTIVE':
              raise SystemExit('A3 status mismatch')
          if policy.get('source_policy_only') is not True:
              raise SystemExit('A3 must remain source-policy-only')

          activation = policy['activation']
          if activation['queue_command_active_in_consumers'] is not False:
              raise SystemExit('A3 must not activate Queue in consumers')
          if activation['legacy_auto_run_full_remains_authoritative_until_adoption'] is not True:
              raise SystemExit('legacy AUTO-RUN FULL compatibility changed')

          command = policy['command']
          if command['minimum_items'] != 1 or command['maximum_items'] != 10:
              raise SystemExit('Queue command bounds changed')
          if command['fresh_explicit_owner_command_required'] is not True:
              raise SystemExit('fresh explicit owner command requirement changed')
          if command['may_be_inferred_from_start_continue_controller_or_history'] is not False:
              raise SystemExit('Queue authority must not be inferred')

          authority = policy['authority']
          if authority['future_adopted_queue_activation_grants_source_authority_for_all_frozen_items'] is not True:
              raise SystemExit('future batch source authority semantics changed')
          if authority['future_adopted_queue_activation_grants_merge_authority_for_all_frozen_items'] is not True:
              raise SystemExit('future batch merge authority semantics changed')
          if authority['authority_is_dormant_until_item_becomes_active'] is not True:
              raise SystemExit('dormant future-item authority invariant changed')
          if authority['maximum_simultaneously_active_items'] != 1:
              raise SystemExit('one ACTIVE item invariant changed')
          for key in (
              'queue_authorizes_live',
              'queue_authorizes_credentials_permissions_or_repository_settings',
              'queue_authorizes_production_runtime_or_data_mutation',
              'later_issue_or_queue_edits_expand_authority',
              'chat_history_is_durable_authority',
              'controller_pointer_is_authority',
          ):
              if authority[key] is not False:
                  raise SystemExit(f'A3 authority boundary changed: {key}')

          receipt = policy['durable_receipt']
          if receipt['consumer_github_surface_required_before_first_source_mutation'] is not True:
              raise SystemExit('durable GitHub receipt requirement changed')
          if receipt['controller_issue_body_must_remain_immutable_after_creation'] is not True:
              raise SystemExit('authorization immutability requirement changed')

          barriers = policy['stability_barriers']
          for key in (
              'post_receipt_main_must_equal_activation_main_before_first_source_mutation',
              'fresh_repository_rules_required_before_each_item_activation',
              'fresh_issue_scope_digest_required_before_each_item_activation',
              'fresh_issue_scope_digest_required_immediately_before_merge',
          ):
              if barriers[key] is not True:
                  raise SystemExit(f'A3 stability barrier changed: {key}')

          merge = policy['per_item_source_authority']
          for key in (
              'merge_requires_expected_head_sha',
              'merge_requires_current_item_active',
              'merge_requires_fresh_exact_head_ci_and_reviews',
              'merge_requires_fresh_scope_and_rules_match',
          ):
              if merge[key] is not True:
                  raise SystemExit(f'A3 merge guard changed: {key}')
          if merge['merge_does_not_authorize_live'] is not True:
              raise SystemExit('merge/live separation changed')

          stops = policy['stop_conditions']
          if stops['failed_or_ambiguous_item_may_be_skipped'] is not False:
              raise SystemExit('failed/ambiguous item skip must remain forbidden')
          if stops['automatic_queue_rewrite'] is not False:
              raise SystemExit('automatic queue rewrite must remain forbidden')

          completion = policy['completion']
          if completion['final_live_requires_separate_authorization'] is not True:
              raise SystemExit('Queue must not grant final LIVE')

          print('AUTO_RUN_FULL_QUEUE_AUTHORIZATION_A3=PASS')
          PY
