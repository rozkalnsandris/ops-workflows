name: Validate shared automation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-workflows-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  public-baseline:
    uses: ./.github/workflows/public-repo-baseline.yml
    with:
      forbid_self_hosted: true

  policy-drift-self-test:
    uses: ./.github/workflows/fast-lane-policy-drift.yml
    with:
      canonical_policy_sha: ${{ github.sha }}
      snapshot_path: policy/fast-lane-v2.2-consumer-baseline.json

  fast-lane-policy:
    name: FAST-LANE policy contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate canonical policy files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          policy_path = Path('policy/fast-lane-v2.2.json')
          consumer_baseline_path = Path('policy/fast-lane-v2.2-consumer-baseline.json')
          drift_workflow_path = Path('.github/workflows/fast-lane-policy-drift.yml')
          doc_path = Path('docs/FAST_LANE_V2_1_HYBRID.md')
          template_path = Path('.github/pull_request_template.md')
          agents_path = Path('AGENTS.md')

          for path in (
              policy_path,
              consumer_baseline_path,
              drift_workflow_path,
              doc_path,
              template_path,
              agents_path,
          ):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'missing FAST-LANE contract file: {path}')

          policy = json.loads(policy_path.read_text(encoding='utf-8'))
          expected = {
              'schema_version': 2,
              'policy': 'FAST-LANE v2.2 Composite',
              'canonical_repository': 'rozkalnsandris/ops-workflows',
              'principle': 'HUMAN_APPROVES_RISK_OR_DECISION_AUTOMATION_EXECUTES_TECHNICAL_STEPS',
              'lanes': ['FAST', 'STRICT'],
          }
          for key, value in expected.items():
              if policy.get(key) != value:
                  raise SystemExit(f'FAST-LANE policy mismatch: {key}')
          if policy.get('fast', {}).get('max_related_work_items') != 5:
              raise SystemExit('FAST-LANE related-work bound changed')
          if policy.get('fast', {}).get('max_scope_preserving_corrective_commits') != 2:
              raise SystemExit('FAST-LANE corrective-commit bound changed')
          if policy.get('human_gate_budget', {}).get('normal_max_owner_gates') != 2:
              raise SystemExit('FAST-LANE human gate budget changed')
          if policy.get('human_gate_budget', {}).get('read_only_checkpoint_creates_owner_gate') is not False:
              raise SystemExit('FAST-LANE read-only gate invariant changed')
          if policy.get('composite_live', {}).get('preflight_is_part_of_one_shot') is not True:
              raise SystemExit('FAST-LANE one-shot preflight invariant changed')
          if policy.get('composite_live', {}).get('candidate_identity_must_match_exact_uploaded_artifact') is not True:
              raise SystemExit('FAST-LANE exact candidate identity invariant changed')
          if policy.get('composite_live', {}).get('zero_normal_traffic_candidate_attachment_allowed_when_platform_requires') is not True:
              raise SystemExit('FAST-LANE zero-traffic candidate invariant changed')
          if policy.get('composite_live', {}).get('pre_enumerated_multi_step_live_sequence_may_share_one_composite_gate') is not True:
              raise SystemExit('FAST-LANE composite multi-step gate invariant changed')
          if policy.get('technical_attempt_limit', {}).get('initial_attempt_plus_scope_preserving_corrections_max') != 3:
              raise SystemExit('FAST-LANE technical attempt ceiling changed')
          if policy.get('technical_attempt_limit', {}).get('stop_before_fourth_attempt') is not True:
              raise SystemExit('FAST-LANE fourth-attempt STOP invariant changed')
          if policy.get('mutation_failure', {}).get('authorization_consumed_at_first_mutation') is not True:
              raise SystemExit('FAST-LANE mutation authorization boundary changed')
          for key in ('automatic_retry', 'automatic_rollback', 'automatic_cleanup', 'alternate_mutation_path'):
              if policy.get('mutation_failure', {}).get(key) is not False:
                  raise SystemExit(f'FAST-LANE post-mutation invariant changed: {key}')
          if policy.get('merge', {}).get('explicit_owner_decision') is not True:
              raise SystemExit('FAST-LANE explicit merge decision invariant changed')
          if policy.get('merge', {}).get('authorizes_live_mutation') is not False:
              raise SystemExit('FAST-LANE merge/live separation changed')
          if policy.get('evidence', {}).get('decision_at_end') is not True:
              raise SystemExit('FAST-LANE owner decision placement changed')

          doc = doc_path.read_text(encoding='utf-8')
          for marker in (
              '## Core rule',
              '## Human gate budget',
              '## Composite STRICT authorization envelope',
              '## One-shot execution',
              '## Failure and rollback',
              '## Operator UX',
              '## Merge invariant',
          ):
              if marker not in doc:
                  raise SystemExit(f'missing policy section: {marker}')
          print('FAST_LANE_POLICY=PASS')
          PY
