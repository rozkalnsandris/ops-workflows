name: LIVE-AUTH contract

on:
  pull_request:
  push:
    branches:
      - main
  issues:
    types:
      - opened
      - edited
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-auth-contract-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-contract:
    if: github.event_name != 'issues'
    name: LIVE-AUTH source contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run LIVE-AUTH contract tests
        run: python3 -m unittest discover -s tests/live_auth -p 'test_*.py' -v

      - name: Compile LIVE-AUTH tooling
        run: python3 -m py_compile scripts/lint_live_auth.py

  issue-lint:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, '[LIVE-AUTH]')
    name: LIVE-AUTH issue lint (read-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout exact policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Lint public LIVE-AUTH envelope
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR_ID: ${{ github.event.issue.user.id }}
          ISSUE_AUTHOR_TYPE: ${{ github.event.issue.user.type }}
        shell: bash
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/live-auth-body.md"
          printf '%s' "$ISSUE_BODY" > "$body_file"
          python3 scripts/lint_live_auth.py \
            --title "$ISSUE_TITLE" \
            --body-file "$body_file" \
            --actor-id "$ISSUE_AUTHOR_ID" \
            --actor-type "$ISSUE_AUTHOR_TYPE"
