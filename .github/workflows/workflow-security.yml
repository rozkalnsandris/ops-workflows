name: Workflow static analysis

on:
  workflow_call:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Pull pinned actionlint 1.7.12 image
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_IMAGE: "rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7"
        run: |
          set -euo pipefail
          docker pull "$ACTIONLINT_IMAGE" >/dev/null
          version="$(docker run --rm --network=none "$ACTIONLINT_IMAGE" -version 2>&1)"
          grep -Fq "$ACTIONLINT_VERSION" <<<"$version"

      - name: Lint GitHub Actions workflows
        shell: bash
        env:
          ACTIONLINT_IMAGE: "rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7"
        run: |
          set -euo pipefail
          docker run --rm --network=none \
            --mount "type=bind,source=$PWD,target=/repo,readonly" \
            --workdir /repo \
            "$ACTIONLINT_IMAGE" -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Audit GitHub Actions workflows
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: "."
          collect: "workflows"
          online-audits: "false"
          persona: "regular"
          min-severity: "medium"
          min-confidence: "medium"
          version: "1.29.0"
          advanced-security: "false"
          annotations: "true"
          color: "true"
